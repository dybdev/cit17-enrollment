<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Enrollment</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css?v=4" />
  </head>
  <body>
    <!-- ========== ENROLLMENT FORM ========== -->
    <div class="container">
      <h1>Student Enrollment</h1>
      <p class="subtitle">Fill out the form in 5 easy steps.</p>

      <!-- Progress: "Step 1 of 5" and a bar that fills up -->
      <p class="step-text" id="stepText">Step 1 of 5</p>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>

      <form id="enrollForm" novalidate>
        <!-- STEP 1: Student ID -->
        <div class="step" id="step1">
          <h2>Student ID</h2>
          <label for="studentId">Student ID *</label>
          <input type="text" id="studentId" placeholder="e.g. 2026-00123" />
          <small class="error" id="studentIdError"></small>
        </div>

        <!-- STEP 2: Name -->
        <div class="step hidden" id="step2">
          <h2>Your Name</h2>

          <label for="prefix">Prefix (optional)</label>
          <input type="text" id="prefix" placeholder="e.g. Ms." />
          <small class="error" id="prefixError"></small>

          <label for="firstName">First Name *</label>
          <input type="text" id="firstName" placeholder="First name" />
          <small class="error" id="firstNameError"></small>

          <label for="middleName">Middle Name (optional)</label>
          <input type="text" id="middleName" placeholder="Middle name" />
          <small class="error" id="middleNameError"></small>

          <label for="lastName">Last Name *</label>
          <input type="text" id="lastName" placeholder="Last name" />
          <small class="error" id="lastNameError"></small>

          <label for="suffix">Suffix (optional)</label>
          <input type="text" id="suffix" placeholder="e.g. Jr." />
          <small class="error" id="suffixError"></small>
        </div>

        <!-- STEP 3: Email -->
        <div class="step hidden" id="step3">
          <h2>Contact</h2>
          <label for="email">Email Address *</label>
          <input type="email" id="email" placeholder="you@example.com" />
          <small class="error" id="emailError"></small>
        </div>

        <!-- STEP 4: Course, Major, Year -->
        <div class="step hidden" id="step4">
          <h2>Academic Info</h2>

          <!-- Custom dropdowns: a button that opens a list of choices -->
          <label for="courseButton">Course *</label>
          <div class="dropdown">
            <!-- The chosen value is saved in this hidden input -->
            <input type="hidden" id="course" />
            <button type="button" class="dropdown-button" id="courseButton">
              <span class="dropdown-text">Select course</span>
              <span class="dropdown-arrow"></span>
            </button>
            <ul class="dropdown-list">
              <li><button type="button" data-value="BSIT">BSIT</button></li>
              <li><button type="button" data-value="BSCS">BSCS</button></li>
              <li><button type="button" data-value="BMMA">BMMA</button></li>
              <li><button type="button" data-value="BSAIS">BSAIS</button></li>
            </ul>
          </div>
          <small class="error" id="courseError"></small>

          <!-- Major only shows when BSIT is selected -->
          <div id="majorBox" class="hidden">
            <label for="majorButton">BSIT Major *</label>
            <div class="dropdown">
              <!-- The chosen value is saved in this hidden input -->
              <input type="hidden" id="major" />
              <button type="button" class="dropdown-button" id="majorButton">
                <span class="dropdown-text">Select major</span>
                <span class="dropdown-arrow"></span>
              </button>
              <ul class="dropdown-list">
                <li><button type="button" data-value="Net Sec">Net Sec</button></li>
                <li><button type="button" data-value="Web Tech">Web Tech</button></li>
                <li><button type="button" data-value="ERP">ERP</button></li>
              </ul>
            </div>
            <small class="error" id="majorError"></small>
          </div>

          <label for="yearButton">Year Level *</label>
          <div class="dropdown">
            <!-- The chosen value is saved in this hidden input -->
            <input type="hidden" id="year" />
            <button type="button" class="dropdown-button" id="yearButton">
              <span class="dropdown-text">Select year level</span>
              <span class="dropdown-arrow"></span>
            </button>
            <ul class="dropdown-list">
              <li><button type="button" data-value="1st Year">1st Year</button></li>
              <li><button type="button" data-value="2nd Year">2nd Year</button></li>
              <li><button type="button" data-value="3rd Year">3rd Year</button></li>
            </ul>
          </div>
          <small class="error" id="yearError"></small>
        </div>

        <!-- STEP 5: Review -->
        <div class="step hidden" id="step5">
          <h2>Review</h2>
          <p class="note">Please check your details before submitting.</p>
          <div id="reviewBox"></div>
        </div>

        <!-- Buttons -->
        <div class="buttons">
          <button type="button" id="backBtn" class="btn btn-light">Back</button>
          <button type="submit" id="nextBtn" class="btn">Next</button>
        </div>
      </form>

      <p class="success hidden" id="successMsg">
        Enrollment submitted successfully!
      </p>
    </div>

    <!-- ========== SUBMITTED STUDENTS TABLE ========== -->
    <div class="container">
      <h2>Submitted Students</h2>
      <div class="table-box">
        <table>
          <thead>
            <tr>
              <th>Student ID</th>
              <th>Name</th>
              <th>Email</th>
              <th>Course</th>
              <th>Major</th>
              <th>Year Level</th>
            </tr>
          </thead>
          <tbody id="studentTable">
            <tr id="emptyRow">
              <td colspan="6">No students enrolled yet.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <script src="script.js?v=4"></script>
  </body>
</html>
